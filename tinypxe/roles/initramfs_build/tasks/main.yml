---
- name: 'Template isolinux configuration'
  vars:
    isolinux_template: 'isolinux.cfg'
  template:
    src: '{{ isolinux_template }}.j2'
    dest: '{{ outputdir }}/isolinux/{{ isolinux_template }}'

- name: 'Create dev nodes'
  loop:
    - { path: '/dev/null', type: 'c', major: 1, minor: 3 }
    - { path: '/dev/zero', type: 'c', major: 1, minor: 5 }
    - { path: '/dev/random', type: 'c', major: 1, minor: 8 }
    - { path: '/dev/console', type: 'c', major: 5, minor: 1 }
    - { path: '/dev/tty', type: 'c', major: 5, minor: 0 }
  command:
    creates: '{{ workdir }}/{{ item.path[1:] }}'
    argv:
      - 'mknod'
      - '-m'
      - '0666'
      - '{{ workdir }}/{{ item.path[1:] }}'
      - '{{ item.type }}'
      - '{{ item.major }}'
      - '{{ item.minor }}'

- name: 'Pack initramfs archive'
  initrd_build:
    chdir: '{{ workdir }}'
    dest: '{{ outputdir }}/initrd.img'
...
