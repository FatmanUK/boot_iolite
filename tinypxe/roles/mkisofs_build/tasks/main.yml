---
- name: 'Copy isolinux binaries'
  loop: '{{ mkisofs_files }}'
  copy:
    src: '{{ item }}'
    dest: '{{ outputdir }}/isolinux/{{ item | basename }}'

- name: 'Make ISO'
  command:
    chdir: '{{ outputdir }}/..'
    argv:
      - 'mkisofs'
      - '-o'
      - '../{{ mkisofs_iso_filename }}'
      - '-b'
      - 'boot/isolinux/isolinux.bin'
      - '-c'
      - 'boot/isolinux/boot.cat'
      - '-no-emul-boot'
      - '-boot-load-size'
      - '4'
      - '-boot-info-table'
      - '-R'
      - '-J'
      - '-iso-level'
      - '3'
      - '-l'
      - '.'
...
# vim: set filetype=yaml
