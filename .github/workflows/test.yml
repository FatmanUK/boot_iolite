name: Test

on:
  push:
    branches:
      - vmother
  pull_request:
    branches:
      - vmother

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
