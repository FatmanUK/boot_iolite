name: Build

on:
  push:
    branches:
      - mother

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24'

    - name: Install dependencies
      run: go mod download

    - name: Run unit tests
      run: make test

    - name: Build Podman image
      run: make podman-build
